<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Palette — Qwerty's Utilities</title>

  <style>
    body {
      background-color: #050F05;
      color: #FFFFFF;

      margin: 0;
      padding: 40px;

      font-family: Arial, sans-serif;
    }

    .page {
      max-width: 900px;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 30px 0;
      font-size: 32px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;

      margin-bottom: 30px;
    }

    .control {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      font-size: 14px;
      font-weight: bold;
    }

    input,
    select {
      font-family: Arial, sans-serif;
    }

    .hex-input {
      width: 110px;
      padding: 8px;

      background-color: #0B1A0B;
      color: #FFFFFF;

      border: 1px solid #003D2B;
      border-radius: 4px;
    }

    .harmony-select {
      padding: 8px;

      background-color: #0B1A0B;
      color: #FFFFFF;

      border: 1px solid #003D2B;
      border-radius: 4px;
    }

    .color-picker {
      width: 60px;
      height: 36px;

      padding: 0;
      border: none;

      background: none;
      cursor: pointer;
    }

    .slider {
      width: 180px;
    }

    .palette-wrapper {
      width: 100%;
      max-width: 700px;

      border-radius: 4px;
      overflow: hidden;
    }

    /*
      The palette itself has NO gap.

      Each column represents one harmony colour.
      Each row represents one shade.
    */
    .palette {
      display: grid;

      grid-template-columns: repeat(
        var(--columns),
        1fr
      );

      grid-auto-rows: 28px;

      gap: 0;

      width: 100%;
    }

    .swatch {
      width: 100%;
      height: 100%;
    }

    .placeholder-1 {
      background-color: #FFFFFF;
    }

    .placeholder-2 {
      background-color: #D9D9D9;
    }

    .placeholder-3 {
      background-color: #B3B3B3;
    }

    .placeholder-4 {
      background-color: #8C8C8C;
    }

    .placeholder-5 {
      background-color: #666666;
    }

    .placeholder-6 {
      background-color: #404040;
    }

    .placeholder-7 {
      background-color: #202020;
    }

    .placeholder-8 {
      background-color: #000000;
    }
  </style>
</head>

<body>

  <div class="page">

    <h1>Palette</h1>

    <div class="controls">

      <div class="control">
        <label for="colorPicker">
          Base Colour
        </label>

        <input
          id="colorPicker"
          class="color-picker"
          type="color"
          value="#00CC88"
        >
      </div>


      <div class="control">
        <label for="hexInput">
          HEX
        </label>

        <input
          id="hexInput"
          class="hex-input"
          type="text"
          value="#00CC88"
          maxlength="7"
        >
      </div>


      <div class="control">
        <label for="harmony">
          Harmony
        </label>

        <select
          id="harmony"
          class="harmony-select"
        >
          <option value="1">
            Monochromatic
          </option>

          <option value="2">
            Complementary
          </option>

          <option value="3">
            Analogous
          </option>

          <option value="3">
            Triadic
          </option>

          <option value="3">
            Split-Complementary
          </option>

          <option value="4">
            Tetradic
          </option>

          <option value="4">
            Double-Complementary
          </option>
        </select>
      </div>


      <div class="control">

        <label for="lighting">
          Lighting
        </label>

        <input
          id="lighting"
          class="slider"
          type="range"
          min="0"
          max="100"
          value="50"
        >

        <div>
          Warm ← → Cold
        </div>

      </div>


      <div class="control">

        <label for="shadeCount">
          Shades
        </label>

        <input
          id="shadeCount"
          class="slider"
          type="range"
          min="3"
          max="12"
          value="8"
        >

      </div>

    </div>


    <div class="palette-wrapper">

      <div
        id="palette"
        class="palette"
        style="--columns: 3;"
      >

        <!--
          Row 1
        -->
        <div class="swatch placeholder-1"></div>
        <div class="swatch placeholder-1"></div>
        <div class="swatch placeholder-1"></div>

        <!--
          Row 2
        -->
        <div class="swatch placeholder-2"></div>
        <div class="swatch placeholder-2"></div>
        <div class="swatch placeholder-2"></div>

        <!--
          Row 3
        -->
        <div class="swatch placeholder-3"></div>
        <div class="swatch placeholder-3"></div>
        <div class="swatch placeholder-3"></div>

        <!--
          Row 4
        -->
        <div class="swatch placeholder-4"></div>
        <div class="swatch placeholder-4"></div>
        <div class="swatch placeholder-4"></div>

        <!--
          Row 5
        -->
        <div class="swatch placeholder-5"></div>
        <div class="swatch placeholder-5"></div>
        <div class="swatch placeholder-5"></div>

        <!--
          Row 6
        -->
        <div class="swatch placeholder-6"></div>
        <div class="swatch placeholder-6"></div>
        <div class="swatch placeholder-6"></div>

        <!--
          Row 7
        -->
        <div class="swatch placeholder-7"></div>
        <div class="swatch placeholder-7"></div>
        <div class="swatch placeholder-7"></div>

        <!--
          Row 8
        -->
        <div class="swatch placeholder-8"></div>
        <div class="swatch placeholder-8"></div>
        <div class="swatch placeholder-8"></div>

      </div>

    </div>

  </div>


  <script>

    const colorPicker =
      document.getElementById('colorPicker');

    const hexInput =
      document.getElementById('hexInput');


    colorPicker.addEventListener(
      'input',
      () => {

        hexInput.value =
          colorPicker.value.toUpperCase();

      }
    );


    hexInput.addEventListener(
      'input',
      () => {

        const value =
          hexInput.value;

        if (
          /^#[0-9A-Fa-f]{6}$/.test(value)
        ) {

          colorPicker.value =
            value;

        }

      }
    );


    const harmony =
      document.getElementById('harmony');

    const palette =
      document.getElementById('palette');


    harmony.addEventListener(
      'change',
      () => {

        const columns =
          parseInt(harmony.value);

        palette.style
          .setProperty(
            '--columns',
            columns
          );

      }
    );


    const shadeCount =
      document.getElementById('shadeCount');


    shadeCount.addEventListener(
      'input',
      () => {

        const rows =
          parseInt(shadeCount.value);

        palette.style
          .gridTemplateRows =
          `repeat(${rows}, 28px)`;

      }
    );

  </script>

</body>
</html>
