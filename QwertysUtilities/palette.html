<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Palette - Qwerty's Utilities</title>

  <link rel="icon" href="/QwertysUtilities/swirl_32x32.ico" type="image/x-icon">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      background-color: #050F05;
      color: #FFFFFF;

      margin: 0;
      padding: 40px;

      font-family: Arial, sans-serif;
    }

    .page {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 30px 0;

      color: #FFFFFF;
      font-size: 32px;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;

      margin-bottom: 40px;
    }

    .control {
      background-color: #081A10;

      border: 2px solid #003D2B;
      border-radius: 12px;

      padding: 18px;
    }

    .control-label {
      display: block;

      margin-bottom: 12px;

      color: #FFFFFF;
      font-size: 15px;
      font-weight: bold;
    }

    .color-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .color-picker {
      width: 55px;
      height: 40px;

      padding: 0;
      border: none;
      border-radius: 6px;

      background: none;
      cursor: pointer;
    }

    .hex-input {
      width: 130px;

      padding: 10px;

      border: 2px solid #003D2B;
      border-radius: 6px;

      background-color: #050F05;
      color: #FFFFFF;

      font-size: 15px;
    }

    .harmony-select {
      width: 100%;

      padding: 10px;

      border: 2px solid #003D2B;
      border-radius: 6px;

      background-color: #050F05;
      color: #FFFFFF;

      font-size: 15px;
      cursor: pointer;
    }

    .slider-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .slider-label {
      font-size: 13px;
      white-space: nowrap;
    }

    .lighting-slider {
      flex: 1;

      accent-color: #00CC88;
      cursor: pointer;
    }

    .palette-section {
      width: 100%;
    }

    .palette-title {
      margin-bottom: 15px;

      font-size: 20px;
      font-weight: bold;
    }

    .palette-grid {
      display: grid;

      grid-template-columns: repeat(4, 1fr);
      grid-auto-rows: 80px;

      gap: 8px;

      width: 100%;
    }

    .swatch {
      position: relative;

      border-radius: 8px;

      display: flex;
      justify-content: center;
      align-items: flex-end;

      padding: 10px;

      overflow: hidden;
    }

    .swatch-label {
      background-color: rgba(0, 0, 0, 0.45);

      padding: 4px 7px;

      border-radius: 4px;

      font-size: 12px;
      font-family: monospace;

      color: #FFFFFF;
    }

    @media (max-width: 700px) {
      body {
        padding: 20px;
      }

      .controls {
        grid-template-columns: 1fr;
      }

      .palette-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <h1>Palette</h1>

    <section class="controls">

      <!-- BASE COLOUR -->

      <div class="control">

        <label class="control-label">
          Base Colour
        </label>

        <div class="color-row">

          <input
            class="color-picker"
            id="colorPicker"
            type="color"
            value="#00CC88"
          >

          <input
            class="hex-input"
            id="hexInput"
            type="text"
            value="#00CC88"
            maxlength="7"
          >

        </div>

      </div>


      <!-- HARMONY -->

      <div class="control">

        <label
          class="control-label"
          for="harmonySelect"
        >
          Colour Harmony
        </label>

        <select
          class="harmony-select"
          id="harmonySelect"
        >

          <option value="monochromatic">
            Monochromatic
          </option>

          <option value="complementary">
            Complementary
          </option>

          <option value="analogous">
            Analogous
          </option>

          <option value="triadic" selected>
            Triadic
          </option>

          <option value="split-complementary">
            Split-Complementary
          </option>

          <option value="tetradic">
            Tetradic
          </option>

          <option value="double-complementary">
            Double-Complementary
          </option>

        </select>

      </div>


      <!-- LIGHTING -->

      <div class="control">

        <label class="control-label">
          Lighting
        </label>

        <div class="slider-row">

          <span class="slider-label">
            Warm
          </span>

          <input
            class="lighting-slider"
            id="lightingSlider"
            type="range"
            min="-100"
            max="100"
            value="0"
          >

          <span class="slider-label">
            Cold
          </span>

        </div>

      </div>


      <!-- SHADE COUNT -->

      <div class="control">

        <label
          class="control-label"
          for="shadeCount"
        >
          Shades
        </label>

        <input
          class="lighting-slider"
          id="shadeCount"
          type="range"
          min="3"
          max="12"
          value="7"
        >

      </div>

    </section>


    <!-- PALETTE -->

    <section class="palette-section">

      <div class="palette-title">
        Generated Palette
      </div>

      <div
        class="palette-grid"
        id="paletteGrid"
      >

        <!-- UI PLACEHOLDERS -->

        <div
          class="swatch"
          style="background-color: #00543A;"
        >
          <span class="swatch-label">
            #00543A
          </span>
        </div>

        <div
          class="swatch"
          style="background-color: #007A55;"
        >
          <span class="swatch-label">
            #007A55
          </span>
        </div>

        <div
          class="swatch"
          style="background-color: #00A86B;"
        >
          <span class="swatch-label">
            #00A86B
          </span>
        </div>

        <div
          class="swatch"
          style="background-color: #00CC88;"
        >
          <span class="swatch-label">
            #00CC88
          </span>
        </div>

        <div
          class="swatch"
          style="background-color: #33DDA0;"
        >
          <span class="swatch-label">
            #33DDA0
          </span>
        </div>

        <div
          class="swatch"
          style="background-color: #66E6B8;"
        >
          <span class="swatch-label">
            #66E6B8
          </span>
        </div>

        <div
          class="swatch"
          style="background-color: #99F0D0;"
        >
          <span class="swatch-label">
            #99F0D0
          </span>
        </div>

      </div>

    </section>

  </main>

  <script>
    const colorPicker =
      document.getElementById('colorPicker');

    const hexInput =
      document.getElementById('hexInput');


    colorPicker.addEventListener('input', () => {

      hexInput.value =
        colorPicker.value.toUpperCase();

    });


    hexInput.addEventListener('change', () => {

      const value =
        hexInput.value.trim();

      if (/^#[0-9A-Fa-f]{6}$/.test(value)) {

        colorPicker.value =
          value;

        hexInput.value =
          value.toUpperCase();
      }

    });
  </script>

</body>
</html>
