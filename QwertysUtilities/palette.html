<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Palette - Qwerty's Utilities</title>

  <link rel="icon" href="/QwertysUtilities/swirl_32x32.ico" type="image/x-icon">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      background-color: #050F05;
      color: #FFFFFF;

      margin: 0;
      padding: 40px;

      font-family: Arial, sans-serif;
    }

    .page {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 30px 0;

      color: #FFFFFF;
      font-size: 32px;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;

      margin-bottom: 40px;
    }

    .control {
      background-color: #081A10;

      border: 2px solid #003D2B;
      border-radius: 12px;

      padding: 18px;
    }

    .control-label {
      display: block;

      margin-bottom: 12px;

      color: #FFFFFF;
      font-size: 15px;
      font-weight: bold;
    }

    .color-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .color-picker {
      width: 55px;
      height: 40px;

      padding: 0;
      border: none;
      border-radius: 6px;

      background: none;
      cursor: pointer;
    }

    .hex-input {
      width: 130px;

      padding: 10px;

      border: 2px solid #003D2B;
      border-radius: 6px;

      background-color: #050F05;
      color: #FFFFFF;

      font-size: 15px;
    }

    .paste-button {
      padding: 10px 14px;

      border: 2px solid #003D2B;
      border-radius: 6px;

      background-color: #050F05;
      color: #FFFFFF;

      font-size: 15px;
      cursor: pointer;
    }

    .paste-button:hover {
      background-color: #003D2B;
    }

    .harmony-select {
      width: 100%;

      padding: 10px;

      border: 2px solid #003D2B;
      border-radius: 6px;

      background-color: #050F05;
      color: #FFFFFF;

      font-size: 15px;
      cursor: pointer;
    }

    .slider-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .slider-label {
      font-size: 13px;
      white-space: nowrap;
    }

    .lighting-slider {
      flex: 1;

      accent-color: #00CC88;
      cursor: pointer;
    }

    .palette-section {
      width: 100%;
    }

    .palette-title {
      margin-bottom: 15px;

      font-size: 20px;
      font-weight: bold;
    }

    .palette-grid {
      display: grid;

      grid-template-columns: repeat(4, 1fr);
      grid-auto-rows: 28px;

      column-gap: 8px;
      row-gap: 0;

      width: 100%;
    }

    .swatch {
      position: relative;

      display: flex;
      justify-content: center;
      align-items: center;

      overflow: hidden;

      cursor: pointer;
    }

    .swatch-label {
      background-color: rgba(0, 0, 0, 0.45);

      padding: 3px 6px;

      border-radius: 4px;

      font-size: 11px;
      font-family: monospace;

      color: #FFFFFF;

      pointer-events: none;
    }

    @media (max-width: 700px) {
      body {
        padding: 20px;
      }

      .controls {
        grid-template-columns: 1fr;
      }

      .palette-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <h1>Palette</h1>

    <section class="controls">

      <!-- BASE COLOUR -->

      <div class="control">

        <label class="control-label">
          Base Colour
        </label>

        <div class="color-row">

          <input
            class="color-picker"
            id="colorPicker"
            type="color"
            value="#00CC88"
          >

          <input
            class="hex-input"
            id="hexInput"
            type="text"
            value="#00CC88"
            maxlength="7"
          >

          <button
            class="paste-button"
            id="pasteButton"
            type="button"
          >
            Paste
          </button>

        </div>

      </div>


      <!-- HARMONY -->

      <div class="control">

        <label
          class="control-label"
          for="harmonySelect"
        >
          Colour Harmony
        </label>

        <select
          class="harmony-select"
          id="harmonySelect"
        >

          <option value="monochromatic">
            Monochromatic
          </option>

          <option value="complementary">
            Complementary
          </option>

          <option value="analogous">
            Analogous
          </option>

          <option value="triadic" selected>
            Triadic
          </option>

          <option value="split-complementary">
            Split-Complementary
          </option>

          <option value="tetradic">
            Tetradic
          </option>

          <option value="double-complementary">
            Double-Complementary
          </option>

        </select>

      </div>


      <!-- LIGHTING -->

      <div class="control">

        <label class="control-label">
          Lighting
        </label>

        <div class="slider-row">

          <span class="slider-label">
            Warm
          </span>

          <input
            class="lighting-slider"
            id="lightingSlider"
            type="range"
            min="-100"
            max="100"
            value="0"
          >

          <span class="slider-label">
            Cold
          </span>

        </div>

      </div>

    </section>


    <!-- PALETTE -->

    <section class="palette-section">

      <div class="palette-title">
        Generated Palette
      </div>

      <div
        class="palette-grid"
        id="paletteGrid"
      ></div>

    </section>

  </main>


  <script>

    const colorPicker =
      document.getElementById('colorPicker');

    const hexInput =
      document.getElementById('hexInput');

    const pasteButton =
      document.getElementById('pasteButton');

    const harmonySelect =
      document.getElementById('harmonySelect');

    const lightingSlider =
      document.getElementById('lightingSlider');

    const paletteGrid =
      document.getElementById('paletteGrid');


    /*
     * HARMONY DEFINITIONS
     */

    const harmonyAngles = {

      monochromatic: [
        0
      ],

      complementary: [
        0,
        180
      ],

      analogous: [
        0,
        30,
        60
      ],

      triadic: [
        0,
        120,
        240
      ],

      'split-complementary': [
        0,
        150,
        210
      ],

      tetradic: [
        0,
        90,
        180,
        270
      ],

      'double-complementary': [
        0,
        30,
        180,
        210
      ]

    };


    /*
     * HEX → HSL
     */

    function hexToHsl(hex) {

      hex =
        hex.replace('#', '');

      const r =
        parseInt(hex.substring(0, 2), 16) / 255;

      const g =
        parseInt(hex.substring(2, 4), 16) / 255;

      const b =
        parseInt(hex.substring(4, 6), 16) / 255;


      const max =
        Math.max(r, g, b);

      const min =
        Math.min(r, g, b);

      let h = 0;
      let s = 0;

      const l =
        (max + min) / 2;


      if (max !== min) {

        const d =
          max - min;

        s =
          l > 0.5
            ? d / (2 - max - min)
            : d / (max + min);


        switch (max) {

          case r:

            h =
              (g - b) / d +
              (g < b ? 6 : 0);

            break;


          case g:

            h =
              (b - r) / d +
              2;

            break;


          case b:

            h =
              (r - g) / d +
              4;

            break;

        }

        h /= 6;

      }


      return {
        h: h * 360,
        s: s * 100,
        l: l * 100
      };

    }


    /*
     * HSL → CSS
     */

    function hslToCss(h, s, l) {

      h =
        ((h % 360) + 360) % 360;

      s =
        Math.max(
          0,
          Math.min(100, s)
        );

      l =
        Math.max(
          0,
          Math.min(100, l)
        );


      return `hsl(${h} ${s}% ${l}%)`;

    }


    /*
     * HSL → HEX
     */

    function hslToHex(h, s, l) {

      h =
        ((h % 360) + 360) % 360;

      s =
        Math.max(0, Math.min(100, s)) / 100;

      l =
        Math.max(0, Math.min(100, l)) / 100;


      const c =
        (1 - Math.abs(2 * l - 1)) * s;

      const x =
        c *
        (1 - Math.abs((h / 60) % 2 - 1));

      const m =
        l - c / 2;


      let r = 0;
      let g = 0;
      let b = 0;


      if (h < 60) {

        r = c;
        g = x;

      } else if (h < 120) {

        r = x;
        g = c;

      } else if (h < 180) {

        g = c;
        b = x;

      } else if (h < 240) {

        g = x;
        b = c;

      } else if (h < 300) {

        r = x;
        b = c;

      } else {

        r = c;
        b = x;

      }


      r =
        Math.round(
          (r + m) * 255
        );

      g =
        Math.round(
          (g + m) * 255
        );

      b =
        Math.round(
          (b + m) * 255
        );


      /*
       * Clamp every RGB channel.
       */

      r =
        Math.max(0, Math.min(255, r));

      g =
        Math.max(0, Math.min(255, g));

      b =
        Math.max(0, Math.min(255, b));


      /*
       * Convert each channel separately.
       */

      const red =
        r.toString(16).padStart(2, '0');

      const green =
        g.toString(16).padStart(2, '0');

      const blue =
        b.toString(16).padStart(2, '0');


      return (
        '#' +
        red +
        green +
        blue
      ).toUpperCase();

    }


    /*
     * GET COLOUR
     */

    function getColour(
      base,
      harmonyAngle,
      lighting,
      progress
    ) {

      /*
       * +1 = highlight
       *  0 = middle
       * -1 = shadow
       */

      const lightPosition =
        (0.5 - progress) * 2;


      /*
       * Lightness.
       */

      const lightnessShift =
        lightPosition * 40;


      let lightness =
        base.l + lightnessShift;


      lightness =
        Math.max(
          5,
          Math.min(95, lightness)
        );


      /*
       * Lighting hue shift.
       *
       * Maximum = 10 degrees.
       */

      const hueShift =
        lightPosition *
        lighting *
        10;


      /*
       * Slight saturation increase
       * toward the extremes.
       */

      const saturation =
        base.s +
        Math.abs(lightPosition) * 8;


      const harmonyHue =
        base.h + harmonyAngle;


      const hue =
        harmonyHue + hueShift;


      return {
        css: hslToCss(
          hue,
          saturation,
          lightness
        ),

        hex: hslToHex(
          hue,
          saturation,
          lightness
        )
      };

    }


    /*
     * COPY COLOUR
     */

    async function copyColour(hex) {

      try {

        await navigator.clipboard.writeText(hex);

      } catch (error) {

        /*
         * Fallback for browsers where
         * Clipboard API is unavailable.
         */

        const textArea =
          document.createElement('textarea');

        textArea.value =
          hex;

        textArea.style.position =
          'fixed';

        textArea.style.opacity =
          '0';

        document.body.appendChild(
          textArea
        );

        textArea.select();

        document.execCommand(
          'copy'
        );

        textArea.remove();

      }

    }


    /*
     * PASTE COLOUR
     */

    async function pasteColour() {

      try {

        const text =
          await navigator.clipboard.readText();

        const value =
          text.trim();


        if (/^#[0-9A-Fa-f]{6}$/.test(value)) {

          colorPicker.value =
            value;

          hexInput.value =
            value.toUpperCase();

          generatePalette();

        }

      } catch (error) {

        /*
         * Clipboard access can be blocked
         * by the browser if permission has
         * not been granted.
         */

        console.log(
          'Unable to read clipboard.',
          error
        );

      }

    }


    /*
     * GENERATE PALETTE
     */

    function generatePalette() {

      const base =
        hexToHsl(colorPicker.value);

      const harmony =
        harmonyAngles[harmonySelect.value];

      const lighting =
        parseInt(lightingSlider.value) / 100;


      paletteGrid.innerHTML = '';


      /*
       * One column per harmony colour.
       */

      paletteGrid.style.gridTemplateColumns =
        `repeat(${harmony.length}, 1fr)`;


      const fragment =
        document.createDocumentFragment();


      /*
       * Seven fixed shades.
       *
       * Rows are generated first so that
       * CSS Grid stays aligned correctly.
       */

      const shadeCount = 7;


      for (let row = 0; row < shadeCount; row++) {

        /*
         * 0 = brightest
         * 1 = darkest
         */

        const progress =
          row / (shadeCount - 1);


        /*
         * Generate every harmony colour
         * for this row.
         */

        for (const angle of harmony) {

          const colour =
            getColour(
              base,
              angle,
              lighting,
              progress
            );


          const swatch =
            document.createElement('div');


          swatch.className =
            'swatch';


          swatch.style.backgroundColor =
            colour.css;


          /*
           * HEX label.
           */

          const label =
            document.createElement('span');


          label.className =
            'swatch-label';


          label.textContent =
            colour.hex;


          swatch.appendChild(
            label
          );


          /*
           * Click to copy HEX.
           */

          swatch.addEventListener(
            'click',
            () => {

              copyColour(
                colour.hex
              );

            }
          );


          fragment.appendChild(
            swatch
          );

        }

      }


      paletteGrid.appendChild(
        fragment
      );

    }


    /*
     * COLOUR PICKER → HEX
     */

    colorPicker.addEventListener(
      'input',
      () => {

        hexInput.value =
          colorPicker.value.toUpperCase();

        generatePalette();

      }
    );


    /*
     * HEX INPUT
     */

    hexInput.addEventListener(
      'change',
      () => {

        const value =
          hexInput.value.trim();


        if (/^#[0-9A-Fa-f]{6}$/.test(value)) {

          colorPicker.value =
            value;

          hexInput.value =
            value.toUpperCase();

          generatePalette();

        }

      }
    );


    /*
     * PASTE BUTTON
     */

    pasteButton.addEventListener(
      'click',
      pasteColour
    );


    /*
     * OTHER CONTROLS
     */

    harmonySelect.addEventListener(
      'input',
      generatePalette
    );

    lightingSlider.addEventListener(
      'input',
      generatePalette
    );


    /*
     * INITIAL PALETTE
     */

    generatePalette();

  </script>

</body>
</html>
