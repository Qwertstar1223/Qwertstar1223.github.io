<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Qwerty's Utilities</title>

  <link rel="icon" type="image/x-icon" href="swirl_32x32.ico">

  <style>
    body {
      background-color: #050F05;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: Arial, sans-serif;
    }

    .circle-container {
      position: relative;
      width: 380px;
      height: 380px;
    }

    .center-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #FFFFFF;
      font-size: 24px;
      font-weight: bold;
      white-space: nowrap;
      z-index: 2;
    }

    /* Temporary ring */
    .ring {
      position: absolute;
      width: 1px;
      height: 1px;
      left: 190px;
      top: 190px;
      z-index: 0;
    }

    .ring-line {
      position: absolute;
      width: 2px;
      height: 1px;
      background-color: #FFFFFF;
      transform-origin: left center;
    }

    .button {
      position: absolute;
      width: 90px;
      height: 90px;
      padding: 0;
      border: none;
      border-radius: 50%;

      background-color: #059600;
      color: #FFFFFF;

      font-size: 14px;
      cursor: pointer;

      display: flex;
      justify-content: center;
      align-items: center;

      transition: transform 0.2s ease;

      z-index: 1;
    }

    .button:hover {
      transform: scale(1.1);
    }

    .button.shrink {
      transform: scale(0.9);
    }

    .tooltip {
      position: absolute;
      bottom: 100%;
      left: 50%;

      transform: translateX(-50%) translateY(-8px);

      background-color: #333333;
      color: #FFFFFF;

      padding: 4px 8px;
      border-radius: 4px;

      font-size: 14px;
      white-space: nowrap;

      opacity: 0;
      pointer-events: none;

      transition: opacity 0.2s ease;
    }

    .button:hover .tooltip {
      opacity: 1;
    }
  </style>
</head>

<body>
  <div class="circle-container" id="circleContainer">
    <div class="center-text">Qwerty's Utilities</div>
  </div>

  <script>
    const container = document.getElementById('circleContainer');

    const buttons = [
      {
        label: 'Dictionary',
        url: '#'
      },
      {
        label: 'Ranks & Tree',
        url: '#'
      },
      {
        label: 'In progress',
        url: '#'
      },
      {
        label: 'In progress',
        url: '#'
      },
      {
        label: 'In progress',
        url: '#'
      },
      {
        label: 'In progress',
        url: '#'
      }
    ];

    // Button spacing / ring settings
    const range = 120;
    const distance = 150;
    const stretch = 1.5;

    const buttonSize = 90;

    const centerX = 190;
    const centerY = 190;


    // ==========================================
    // TEMPORARY RING
    // ==========================================

    const ring = document.createElement('div');

    ring.className = 'ring';

    const ringSteps = 200;

    let previousX = null;
    let previousY = null;

    for (let i = 0; i <= ringSteps; i++) {

      const angle =
        -range +
        (i / ringSteps) * (range * 2);

      const radians =
        angle * Math.PI / 180;

      const x =
        Math.sin(radians) *
        distance *
        stretch;

      const y =
        -Math.cos(radians) *
        distance;

      if (previousX !== null) {

        const dx = x - previousX;
        const dy = y - previousY;

        const length =
          Math.sqrt(
            dx * dx +
            dy * dy
          );

        const rotation =
          Math.atan2(dy, dx) *
          180 / Math.PI;

        const line =
          document.createElement('div');

        line.className = 'ring-line';

        line.style.width =
          `${length}px`;

        line.style.left =
          `${previousX}px`;

        line.style.top =
          `${previousY}px`;

        line.style.transform =
          `rotate(${rotation}deg)`;

        ring.appendChild(line);
      }

      previousX = x;
      previousY = y;
    }

    container.appendChild(ring);


    // ==========================================
    // BUTTONS
    // ==========================================

    const amount = buttons.length;

    buttons.forEach((buttonData, index) => {

      let angle;

      if (amount === 1) {
        angle = 0;
      } else {
        angle =
          -range +
          (index * (range * 2)) /
          (amount - 1);
      }

      const radians =
        angle * Math.PI / 180;

      const ringX =
        Math.sin(radians) *
        distance;

      const ringY =
        -Math.cos(radians) *
        distance;

      // Stretch the ring horizontally
      const stretchedX =
        ringX * stretch;

      const stretchedY =
        ringY;

      const left =
        centerX +
        stretchedX -
        buttonSize / 2;

      const top =
        centerY +
        stretchedY -
        buttonSize / 2;

      const button =
        document.createElement('button');

      button.className = 'button';

      button.style.left =
        `${left}px`;

      button.style.top =
        `${top}px`;

      button.textContent =
        buttonData.label;

      const tooltip =
        document.createElement('div');

      tooltip.className = 'tooltip';

      tooltip.textContent =
        buttonData.label;

      button.appendChild(tooltip);

      button.addEventListener('click', () => {

        button.classList.add('shrink');

        setTimeout(() => {
          button.classList.remove('shrink');
        }, 200);

        if (buttonData.url !== '#') {
          window.location.href =
            buttonData.url;
        }
      });

      container.appendChild(button);
    });
  </script>
</body>
</html>
