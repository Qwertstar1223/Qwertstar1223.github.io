<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Qwerty's Utilities</title>

  <link rel="icon" type="image/x-icon" href="swirl_32x32.ico">

  <style>
    body {
      background-color: #050F05;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: Arial, sans-serif;
    }

    .circle-container {
      position: relative;
      width: 380px;
      height: 380px;
    }

    .center-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #FFFFFF;
      font-size: 24px;
      font-weight: bold;
      white-space: nowrap;
    }

    .button {
      position: absolute;
      width: 100px;
      height: 100px;
      padding: 0;
      border: none;
      border-radius: 50%;

      background-color: #059600;
      color: #FFFFFF;

      font-size: 14px;
      cursor: pointer;

      display: flex;
      justify-content: center;
      align-items: center;

      transition: transform 0.2s ease;
    }

    .button:hover {
      transform: scale(1.1);
    }

    .button.shrink {
      transform: scale(0.9);
    }

    .tooltip {
      position: absolute;
      bottom: 100%;
      left: 50%;

      transform: translateX(-50%) translateY(-8px);

      background-color: #333333;
      color: #FFFFFF;

      padding: 4px 8px;
      border-radius: 4px;

      font-size: 14px;
      white-space: nowrap;

      opacity: 0;
      pointer-events: none;

      transition: opacity 0.2s ease;
    }

    .button:hover .tooltip {
      opacity: 1;
    }
  </style>
</head>

<body>
  <div class="circle-container" id="circleContainer">
    <div class="center-text">Qwerty's Utilities</div>
  </div>

  <script>
    const container = document.getElementById('circleContainer');

    const buttons = [
      {
        label: 'Dictionary',
        url: '#'
      },
      {
        label: 'Ranks & Tree',
        url: '#'
      },
      {
        label: 'In progress',
        url: '#'
      },
      {
        label: 'In progress',
        url: '#'
      },
      {
        label: 'In progress',
        url: '#'
      },
      {
        label: 'In progress',
        url: '#'
      }
    ];

    /*
      ==============================
      BUTTON LAYOUT SETTINGS
      ==============================

      range:
        Maximum absolute angle from
        straight up.

        0°   = straight up
        90°  = left/right
        180° = straight down

        Buttons are spread between
        -range and +range.

      distance:
        Distance from the center.

      stretch:
        Horizontal stretching.

        0 = normal circle
        Higher values = more stretching.
    */

    const range = 120;
    const distance = 170;
    const stretch = 1.18;

    const buttonSize = 100;

    const centerX = 190;
    const centerY = 190;


    /*
      ==============================
      CREATE BUTTONS
      ==============================
    */

    buttons.forEach((buttonData, index) => {

      const amount = buttons.length;

      /*
        Spread the buttons evenly between
        -range and +range.
      */

      let angle;

      if (amount === 1) {
        angle = 0;
      } else {
        angle =
          -range +
          (index * (range * 2)) / (amount - 1);
      }

      /*
        Convert degrees to radians.
      */

      const radians = angle * Math.PI / 180;


      /*
        Move forward by distance.

        0° points directly upward.
      */

      let x =
        Math.sin(radians) * distance;

      let y =
        -Math.cos(radians) * distance;


      /*
        ==============================
        HORIZONTAL STRETCH
        ==============================

        Applied after moving forward,
        matching the Scratch prototype.
      */

      x += distance * ((x / 180) * stretch);


      /*
        Convert to CSS coordinates.
      */

      const left =
        centerX + x - buttonSize / 2;

      const top =
        centerY + y - buttonSize / 2;


      /*
        ==============================
        CREATE BUTTON
        ==============================
      */

      const button = document.createElement('button');

      button.className = 'button';

      button.style.left = `${left}px`;
      button.style.top = `${top}px`;

      button.textContent = buttonData.label;


      /*
        Tooltip
      */

      const tooltip = document.createElement('div');

      tooltip.className = 'tooltip';
      tooltip.textContent = buttonData.label;

      button.appendChild(tooltip);


      /*
        Click animation
      */

      button.addEventListener('click', () => {

        button.classList.add('shrink');

        setTimeout(() => {
          button.classList.remove('shrink');
        }, 200);

        if (buttonData.url !== '#') {
          window.location.href = buttonData.url;
        }
      });


      container.appendChild(button);
    });
  </script>
</body>
</html>
